services:
  api-monitoramento:
    build: ./app/backend
    depends_on:
      - db-monitoramento
    container_name: api-monitoramento
    ports:
      - "8000:8000"
    volumes:
      - ./app/backend:/app
      - images:/app/static/images
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
  
  db-monitoramento:
    image: mysql:8.0
    container_name: db-monitoramento
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: monitoramento    
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  
  frontend-react:
    build: ./app/frontend
    container_name: frontend-react
    ports:
      - "5173:5173"
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    depends_on:
      - api-monitoramento
    command: npm run dev -- --host

volumes:
  db_data:
  images: